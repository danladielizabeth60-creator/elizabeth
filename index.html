<!DO<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register New Staff</title>
</head>

<body>

    <h1>Register New Staff</h1>

    <form>

        <!-- Username -->
        <label for="username">Username:</label>
        <input type="text" id="username" name="username">
        <br><br>

        <!-- Password -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>

        <!-- Full Name -->
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname">
        <br><br>

        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <br><br>

        <!-- Phone Number -->
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone">
        <br><br>

        <!-- Address -->
        <label for="address">Address:</label>
        <input type="text" id="address" name="address">
        <br><br>

        <!-- Designation -->
        <label for="designation">Designation:</label>
        <select id="designation" name="designation">

            <option value="General manager">General manager</option>
            <option value="Sales executive">Sales executive</option>
            <option value="Secretary">Secretary</option>
            <option value="Project supervisor" selected>
                Project supervisor
            </option>
            <option value="Cleaner">Cleaner</option>
            <option value="Gate keeper">Gate keeper</option>

        </select>

        <label for="other">Other:</label>
        <input type="text" id="other" name="other">
        <br><br>

        <!-- Department -->
        <label for="department">Department:</label>
        <select id="department" name="department">

            <option value="Management">Management</option>
            <option value="Logistic department">Logistic department</option>
            <option value="Procurement department">Procurement department</option>
            <option value="Information technology" selected>
                Information technology
            </option>
            <option value="Security department">Security department</option>
            <option value="Operational department">
                Operational department
            </option>
            <option value="Research department">
                Research department
            </option>
            <option value="Legal department">Legal department</option>
            <option value="Finance">Finance</option>
            <option value="Others">Others</option>

        </select>
        <br><br>

        <!-- Hotel Branch -->
        <label for="branch">Hotel Branch:</label>
        <select id="branch" name="branch">

            <option value="Kuto">Kuto</option>
            <option value="Lafenwa">Lafenwa</option>
            <option value="Olomoore">Olomoore</option>
            <option value="Soyoye" selected>Soyoye</option>
            <option value="Panseke">Panseke</option>
            <option value="Itoku">Itoku</option>

        </select>
        <br><br>

        <!-- Buttons -->
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
